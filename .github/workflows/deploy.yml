name: Deploy Backend to GCP

on:
  push:
    branches: [ "develop" ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  IMAGE_NAME: backend-app
  REGION: asia-northeast3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 저장소 코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Service Account Key(JSON) 기반 GCP 인증
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        token_format: 'access_token'

    # 3. GCP Cloud SDK 설정
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # 4. Docker Login Action으로 GAR 로그인
    - name: Log in to GCP Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    # 5. Docker 이미지 빌드 및 Artifact Registry로 Push
    - name: Build and Push Docker Image
      run: |
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        LATEST_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
        
        docker build -t $IMAGE_TAG -t $LATEST_TAG .
        docker push $IMAGE_TAG
        docker push $LATEST_TAG

    # 6. GCP VM 인스턴스에 SSH 접속 후 새 Docker 컨테이너 실행
    - name: Deploy to GCP VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_VM_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          
          # 기존 컨테이너 중지 및 삭제
          docker stop backend-container || true
          docker rm backend-container || true
          
          # 최신 이미지 Pull 및 컨테이너 실행
          docker pull $IMAGE_TAG
          docker run -d --name backend-container -p 8080:8080 $IMAGE_TAG
          
          # 불필요한 구형 이미지 정리
          docker image prune -f
