spring:
  application:
    name: SupHernova

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    org.hibernate.SQL: debug

openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini

  tts:
    model: ${OPENAI_TTS_MODEL:tts-1}
    voice: ${OPENAI_TTS_VOICE:alloy}

app:
  storage:
    audio-base-path: ${AUDIO_STORAGE_PATH:./storage/audio}
