spring:
  application:
    name: SupHernova

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:suphernova}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true